[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "free-search"
version = "0.1.0"
description = "Local multimodal file search with incremental hybrid retrieval"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "PySide6", "lancedb", "jieba", "numpy", "Pillow", "pypdf", "pypdfium2",
  "rapidocr-onnxruntime", "torch", "transformers", "faster-whisper", "av",
  "keyring", "httpx", "psutil", "filelock"
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
free-search = "free_search.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
